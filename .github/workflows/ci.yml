name: ci

# What this workflow proves: the Rust workspace is rustfmt-clean, builds in
# release mode, and passes its own tests, and the translator's daslang-free
# gates hold (test registry derived from cases.json; architecture, governance,
# ptr/ABI, diagnostic and record-order tests; insta snapshots of the printed
# output).  It runs no daScript: translated programs are executed only by the
# `c2das-runtime` workflow and, authoritatively, by the local preflight
# `bash scripts/c2das_preflight.sh`.
#
# Linux only.  The job runs on ubuntu-22.04 with LLVM/Clang 18 from
# apt.llvm.org because that is the environment the checked-in snapshots were
# recorded in: the `*.c.linux.das.snap` files embed diagnostics whose Clang
# type ids depend on the glibc headers.  A macOS build has not been verified
# for this fork, so there is no macOS job.
#
# Warnings are not denied (`-D warnings`): the translator crates carry
# pre-existing warnings, and this workflow must be able to pass.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    name: Rust workspace (ubuntu-22.04, Clang 18)
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-18

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang/LLVM 18 (apt.llvm.org)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-18.list
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev cmake
          # The snapshot harness compile-checks each input with plain `clang`.
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"

      # nightly-2022-11-03 is the workspace toolchain (rust-toolchain.toml).
      # The C2Rust-only toolchains (nightly-2023-04-15, nightly-2026-03-03) are
      # needed only by c2rust-transpile's snapshot test, which is excluded below.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2022-11-03 --profile minimal \
            --component rustfmt,rustc-dev,rust-src,miri,rust-analyzer
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: Test registry is derived from cases.json
        run: python3 scripts/check_test_registry.py --check

      - name: cargo build --release
        run: cargo build --release

      # Two inherited suites are excluded because they are red on a clean
      # checkout for reasons outside this workflow:
      # - c2rust-transpile's `snapshots` test checks the Rust output of the
      #   upstream C2Rust translator (45 of 47 fail), which c2das does not ship;
      # - das_ast's `generated_tests` reads tests/syntax/00_const.das, a
      #   generated file that is not checked in.
      - name: cargo test --workspace --release (c2das surface)
        run: >-
          cargo test --workspace --release --no-fail-fast
          --exclude c2rust-transpile --exclude das_ast

      # Already part of the workspace run above; repeated as a named step so
      # that a red translator contract is visible on its own.
      - name: Translator contract tests
        run: >-
          cargo test --release -p c2dascript-transpile
          --test architecture_tests --test governance_tests --test ptr_tests
          --test diagnostic_tests --test record_order_tests --test snapshots

      - name: Tests left no untracked files in the checkout
        run: |
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "untracked artifacts are forbidden:" >&2
            echo "$untracked" >&2
            exit 1
          fi
